[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "openmatrix"
version = "0.4.0"
description = "OMX, the open matrix data format"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Jake Moss", email = "jake@outerloop.io" },
  { name = "Billy Charlton", email = "mail@billyc.cc" },
  { name = "Ben Stabler", email = "benstabler@yahoo.com" },
]

license = "Apache-2.0"
license-files = ["LICENSE.TXT"]

classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["openmatrix", "omx"]
dependencies = [
    "h5py >= 2.10.0",
    "numpy >= 1.5.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff == 0.14.10"
]

[project.urls]
"Homepage" = "https://github.com/osPlanning/omx"

[project.scripts]
omx-validate = "openmatrix.validator:command_line"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
